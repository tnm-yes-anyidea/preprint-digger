<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprint Digger (Native Engine)</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --subtext: #94a3b8; --accent: #10b981; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        .hero { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; border-top: 4px solid var(--accent); }
        h1 { margin-top: 0; font-size: 1.8em; color: white; }
        textarea { width: 100%; box-sizing: border-box; padding: 15px; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); min-height: 90px; resize: vertical;}
        textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .controls { display: flex; gap: 12px; }
        select, button { padding: 12px 16px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        button.primary { background: var(--accent); color: #022c22; border: none; font-weight: bold; cursor: pointer; flex-grow: 1; transition: 0.2s; }
        button.primary:hover { background: #059669; color: white; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .paper-card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .paper-title { font-size: 1.25em; margin: 0 0 10px 0; color: #e2e8f0; padding-right: 80px; }
        .match-badge { position: absolute; top: 20px; right: 20px; background: #064e3b; color: #34d399; font-weight: bold; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; border: 1px solid #059669; }
        .paper-meta { font-size: 0.85em; color: var(--subtext); margin-bottom: 12px; }
        .actions { margin-top: 15px; }
        .actions a { text-decoration: none; color: var(--text); background: var(--border); padding: 6px 12px; border-radius: 6px; font-size: 0.9em; transition: 0.2s; }
        .actions a:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>🔍 Preprint Digger</h1>
        <p style="margin:0; color:var(--subtext);">Powered by FastEmbed & SQLite-Vec Persistent Storage.</p>

        <textarea id="search-profile" placeholder="Describe your exact research problem..."></textarea>

        <div class="controls">
            <select id="category">
                <option value="cs.LG">Machine Learning</option>
                <option value="cs.AI">Artificial Intelligence</option>
                <option value="cs.CR">Cryptography</option>
            </select>
            <button id="scan-btn" class="primary">Search SQLite Database</button>
        </div>
        <p id="status" style="text-align: center; color: var(--subtext); font-size: 0.9em; margin-top: 15px;"></p>
    </div>

    <div id="feed"></div>

    <script>
        document.getElementById('scan-btn').addEventListener('click', async () => {
            const query = document.getElementById('search-profile').value;
            const category = document.getElementById('category').value;
            const status = document.getElementById('status');
            const feed = document.getElementById('feed');
            const btn = document.getElementById('scan-btn');

            if (!query) { alert("Please enter a query."); return; }

            btn.disabled = true;
            feed.innerHTML = '';
            status.innerText = "Syncing latest arXiv papers & querying local SQLite Vector DB...";

            try {
                const response = await fetch('http://127.0.0.1:5000/api/radar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, query })
                });

                const papers = await response.json();
                status.innerText = "";

                papers.forEach(paper => {
                    feed.innerHTML += `
                        <div class="paper-card">
                            <div class="match-badge">🔥 ${paper.match_score}% Match</div>
                            <h3 class="paper-title">${paper.title}</h3>
                            <div class="paper-meta">${paper.authors.join(', ')} • ${paper.published}</div>
                            <p style="color: var(--subtext); font-size: 0.95em;">${paper.summary}</p>
                            <div class="actions">
                                <a href="${paper.link}" target="_blank">View on ArXiv ↗</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                status.innerText = "";
                feed.innerHTML = `<p style="color:#ef4444; text-align:center;">Error connecting to Python backend.</p>`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

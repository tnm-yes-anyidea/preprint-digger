<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preprint Digger - Semantic Search</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --subtext: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
            --border: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 850px; margin: 0 auto; padding: 20px; line-height: 1.5; }
        .hero { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; border-top: 4px solid var(--accent); }
        h1 { margin-top: 0; font-size: 1.8em; display: flex; justify-content: space-between; align-items: center; }
        .bookmark-toggle { font-size: 0.6em; background: #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; color: white; }
        textarea { width: 100%; box-sizing: border-box; padding: 15px; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); resize: vertical; min-height: 100px; }
        textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .controls { display: flex; gap: 12px; align-items: center; }
        select, button { padding: 12px 16px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        button.primary { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; flex-grow: 1; transition: 0.2s; }
        button.primary:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Progress Bar UI */
        #progress-container { display: none; margin-top: 15px; }
        .progress-text { font-size: 0.85em; color: var(--subtext); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar-bg { width: 100%; background: var(--border); border-radius: 6px; overflow: hidden; height: 8px; }
        #progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }

        /* Paper Cards */
        .paper-card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 20px; position: relative; border: 1px solid var(--border); }
        .paper-title { font-size: 1.3em; margin: 0 0 10px 0; padding-right: 90px; color: #e2e8f0; }

        .match-badge { position: absolute; top: 20px; right: 20px; font-weight: bold; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; }
        .match-high { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .match-med { background: #422006; color: #fbbf24; border: 1px solid #d97706; }
        .match-low { background: #334155; color: #94a3b8; border: 1px solid #475569; }

        .paper-meta { font-size: 0.85em; color: var(--accent); margin-bottom: 10px; font-weight: 600; }
        .paper-summary { color: var(--subtext); font-size: 0.95em; }
        .actions { margin-top: 15px; display: flex; gap: 15px; align-items: center; }
        .actions a { text-decoration: none; color: var(--text); background: var(--border); padding: 6px 12px; border-radius: 6px; font-size: 0.9em; transition: 0.2s; }
        .actions a:hover { background: #475569; }
        .btn-save { background: none; border: 1px solid var(--border); color: var(--subtext); cursor: pointer; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; }
        .btn-save.saved { background: #064e3b; color: #34d399; border-color: #059669; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>
            <span>🧠 Preprint Digger</span>
            <button class="bookmark-toggle" onclick="renderBookmarks()">View Saved Papers</button>
        </h1>
        <p style="margin:0; color:var(--subtext); font-size:0.95em;">100% Client-Side Semantic Search. Runs locally via WebAssembly.</p>

        <textarea id="search-profile" placeholder="Describe your exact research problem (e.g., 'Optimizing inference speed for large language models on edge devices using quantization...')"></textarea>

        <div class="controls">
            <select id="category">
                <option value="cs.LG">Machine Learning (cs.LG)</option>
                <option value="cs.AI">Artificial Intelligence (cs.AI)</option>
                <option value="cs.CV">Computer Vision (cs.CV)</option>
                <option value="cs.CR">Cryptography (cs.CR)</option>
            </select>
            <button id="scan-btn" class="primary">Extract & Rank Papers</button>
        </div>

        <div id="progress-container">
            <div class="progress-text">
                <span id="progress-status">Initializing AI Engine...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="feed"></div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0';

        env.allowLocalModels = false;
        let extractor = null;
        let currentPapers = [];

        // UI Elements
        const statusText = document.getElementById('progress-status');
        const percentText = document.getElementById('progress-percent');
        const barFill = document.getElementById('progress-bar-fill');
        const progContainer = document.getElementById('progress-container');
        const feed = document.getElementById('feed');
        const btn = document.getElementById('scan-btn');

        function cosineSimilarity(vecA, vecB) {
            let dotProduct = 0, normA = 0, normB = 0;
            for (let i = 0; i < vecA.length; i++) {
                dotProduct += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
            }
            return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        }

        async function loadModel() {
            if (!extractor) {
                progContainer.style.display = 'block';
                statusText.innerText = "Caching ONNX ML Model (First run only)...";

                extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            const percent = Math.round((data.loaded / data.total) * 100);
                            barFill.style.width = `${percent}%`;
                            percentText.innerText = `${percent}%`;
                        }
                    }
                });
            }
        }

        window.toggleSave = function(id) {
            const paper = currentPapers.find(p => p.id === id) || JSON.parse(localStorage.getItem('digger_saved')).find(p => p.id === id);
            let saved = JSON.parse(localStorage.getItem('digger_saved')) || [];

            if (saved.some(p => p.id === id)) {
                saved = saved.filter(p => p.id !== id);
                document.getElementById(`btn-${id}`).classList.remove('saved');
                document.getElementById(`btn-${id}`).innerText = '☆ Save';
            } else {
                saved.push(paper);
                document.getElementById(`btn-${id}`).classList.add('saved');
                document.getElementById(`btn-${id}`).innerText = '★ Saved';
            }
            localStorage.setItem('digger_saved', JSON.stringify(saved));
        };

        window.renderBookmarks = function() {
            const saved = JSON.parse(localStorage.getItem('digger_saved')) || [];
            if (saved.length === 0) {
                feed.innerHTML = `<p style="text-align:center; color:var(--subtext);">No papers saved yet.</p>`;
                return;
            }
            feed.innerHTML = `<h2 style="color:var(--text); border-bottom:1px solid var(--border); padding-bottom:10px;">Your Reading List</h2>`;
            renderCards(saved, false);
        };

        function renderCards(papers, showScores = true) {
            const saved = JSON.parse(localStorage.getItem('digger_saved')) || [];
            let html = '';

            papers.forEach(paper => {
                const isSaved = saved.some(p => p.id === paper.id);
                let badgeHtml = '';

                if (showScores) {
                    const badgeClass = paper.score >= 75 ? 'match-high' : (paper.score >= 50 ? 'match-med' : 'match-low');
                    badgeHtml = `<div class="match-badge ${badgeClass}">🔥 ${paper.score}% Match</div>`;
                }

                html += `
                    <div class="paper-card">
                        ${badgeHtml}
                        <h3 class="paper-title">${paper.title}</h3>
                        <div class="paper-meta">${paper.authors.join(', ')} • ${paper.published}</div>
                        <p class="paper-summary">${paper.summary}</p>
                        <div class="actions">
                            <a href="${paper.link}" target="_blank">PDF / ArXiv ↗</a>
                            <button id="btn-${paper.id}" class="btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${paper.id}')">
                                ${isSaved ? '★ Saved' : '☆ Save'}
                            </button>
                        </div>
                    </div>
                `;
            });
            feed.innerHTML += html;
        }

        btn.addEventListener('click', async () => {
            const query = document.getElementById('search-profile').value;
            const category = document.getElementById('category').value;

            if (!query) { alert("Please describe your research focus."); return; }

            btn.disabled = true;
            feed.innerHTML = '';
            progContainer.style.display = 'block';
            barFill.style.width = `0%`;
            percentText.innerText = '';

            try {
                await loadModel();

                statusText.innerText = "Fetching latest 60 papers via proxy...";
                barFill.style.width = `50%`;

                const arxivUrl = encodeURIComponent(`http://export.arxiv.org/api/query?search_query=cat:${category}&sortBy=submittedDate&sortOrder=descending&max_results=60`);
                const response = await fetch(`https://api.allorigins.win/raw?url=${arxivUrl}`);
                const xmlText = await response.text();

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const entries = xmlDoc.getElementsByTagName("entry");

                currentPapers = [];
                let summaries = [];

                for (let i = 0; i < entries.length; i++) {
                    const entry = entries[i];
                    const summary = entry.getElementsByTagName("summary")[0].textContent.replace(/\n/g, ' ').trim();
                    const link = entry.getElementsByTagName("id")[0].textContent;
                    summaries.push(summary);
                    currentPapers.push({
                        id: link.split('/').pop(),
                        title: entry.getElementsByTagName("title")[0].textContent.replace(/\n/g, ' ').trim(),
                        summary: summary,
                        link: link,
                        published: entry.getElementsByTagName("published")[0].textContent.split('T')[0],
                        authors: Array.from(entry.getElementsByTagName("author")).map(a => a.getElementsByTagName("name")[0].textContent)
                    });
                }

                statusText.innerText = "Calculating semantic vectors natively...";
                barFill.style.width = `80%`;

                const queryOutput = await extractor([query], { pooling: 'mean', normalize: true });
                const queryVector = queryOutput.tolist()[0];

                const papersOutput = await extractor(summaries, { pooling: 'mean', normalize: true });
                const paperVectors = papersOutput.tolist();

                for (let i = 0; i < currentPapers.length; i++) {
                    const similarity = cosineSimilarity(queryVector, paperVectors[i]);
                    currentPapers[i].score = Math.round(similarity * 100);
                }

                currentPapers.sort((a, b) => b.score - a.score);

                barFill.style.width = `100%`;
                setTimeout(() => { progContainer.style.display = 'none'; }, 500);

                // Render top 15 results
                renderCards(currentPapers.slice(0, 15));

            } catch (err) {
                progContainer.style.display = 'none';
                feed.innerHTML = `<p style="color:#ef4444; text-align:center;">Network or Parsing Error: ${err.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
